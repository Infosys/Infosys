  # User Management endpoints
  /users:
    get:
      tags:
        - User
      summary: Get all users
      description: Retrieve a paginated list of all users with optional filtering
      parameters:
        - name: page
          in: query
          description: Page number (0-based)
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Page size
          required: false
          schema:
            type: integer
            default: 20
        - name: role
          in: query
          description: Filter by user role
          required: false
          schema:
            type: string
            enum: ["COMMISSIONER_APPROVER", "SERVICE_MANAGER", "AGENT", "CITIZEN"]
        - name: isActive
          in: query
          description: Filter by active status
          required: false
          schema:
            type: boolean
        - name: username
          in: query
          description: Filter by username (partial match)
          required: false
          schema:
            type: string
        - name: email
          in: query
          description: Filter by email (partial match)
          required: false
          schema:
            type: string
        - name: ward
          in: query
          description: Filter by ward (partial match)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/User'
                    - type: object
                      properties:
                        password:
                          type: string
                          readOnly: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - User
      summary: Create a new user
      description: Create a new user account with specified role and permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
            example:
              username: "john.doe"
              email: "john.doe@example.com"
              password: "SecurePass123"
              role: "CITIZEN"
              ward: "Ward-5"
              profile:
                firstName: "John"
                lastName: "Doe"
                fullName: "John Doe"
                phoneNumber: "9876543210"
                adhaarNo: 123456789012
                gender: "MALE"
                relationshipToProperty: "OWNER"
                ownershipShare: 100.0
                isPrimaryOwner: true
                department: null
                designation: "Property Owner"
              permissions: ["VIEW_APPLICATIONS", "CREATE_APPLICATIONS"]
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/User'
                          - type: object
                            properties:
                              password:
                                type: string
                                readOnly: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Username or email already exists
        '500':
          $ref: '#/components/responses/InternalServerError'

