  /applications/search:
    get:
      tags:
        - Application
      summary: Search applications with advanced filters
      description: Search applications by various criteria including owner details, location, and application status
      parameters:
        # Pagination parameters
        - name: page
          in: query
          description: Page number (0-based)
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Page size
          required: false
          schema:
            type: integer
            default: 20
        
        # Search parameters
        - name: ownerName
          in: query
          description: Search by applications owner name
          required: false
          schema:
            type: string
        - name: ownerEmail
          in: query
          description: Search by applications owner email
          required: false
          schema:
            type: string
        - name: ownerPhone
          in: query
          description: Search by applications owner phone number
          required: false
          schema:
            type: string
        - name: latitude
          in: query
          description: Search by latitude coordinate
          required: false
          schema:
            type: number
            format: float
        - name: longitude
          in: query
          description: Search by longitude coordinate
          required: false
          schema:
            type: number
            format: float
        - name: address
          in: query
          description: Search by property address (locality, street, etc.)
          required: false
          schema:
            type: string
        - name: propertyId
          in: query
          description: Search by property ID
          required: false
          schema:
            type: integer
            format: int64
        
        # Filter parameters
        - name: agentName
          in: query
          description: Filter by assigned agent name
          required: false
          schema:
            type: string
        - name: wardNo
          in: query
          description: Filter by ward number
          required: false
          schema:
            type: string
        - name: zoneNo
          in: query
          description: Filter by zone number
          required: false
          schema:
            type: string
        - name: applicationStatus
          in: query
          description: Filter by application status (values from workflow microservice)
          required: false
          schema:
            type: string
        - name: applicationDueDateFrom
          in: query
          description: Filter applications with due date from this date (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: applicationDueDateTo
          in: query
          description: Filter applications with due date to this date (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: applicationCreatedDateFrom
          in: query
          description: Filter applications created from this date (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: applicationCreatedDateTo
          in: query
          description: Filter applications created to this date (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        
        # Sort parameters
        - name: sortBy
          in: query
          description: Sort by field
          required: false
          schema:
            type: string
            enum: ["createdAt", "updatedAt", "dueDate"]
            default: "createdAt"
        - name: sortOrder
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum: ["asc", "desc"]
            default: "desc"
      responses:
        '200':
          description: Properties search results retrieved successfully
          headers:
            X-Total-Count:
              description: Total number of matching properties
              schema:
                type: integer
            X-Current-Page:
              description: Current page number (0-based)
              schema:
                type: integer
            X-Per-Page:
              description: Number of properties per page
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Property'
                    - type: object
                      properties:
                        searchScore:
                          type: number
                          format: float
                          description: Relevance score for the search result
                        matchedFields:
                          type: array
                          items:
                            type: string
                          description: List of fields that matched the search criteria
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'


