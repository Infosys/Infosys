# Common Labels
labels:
  app: "egov-workflow"
  group: "core"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: false
    schemaTable: "egov_workflow_schema"
    image:
      repository: "egov-workflow-db"

# Container Configs
image:
  repository: "egov-workflow"
replicas: "1"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx192m -Xms192m"

# Additional Container Envs
env: |
  - name: SERVER_PORT
    value: "8081"
