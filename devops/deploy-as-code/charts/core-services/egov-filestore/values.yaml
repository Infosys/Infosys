# Common Labels
labels:
  app: "egov-filestore"
  group: "core"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "egov_filestore_schema"
    image:
      repository: "egov-filestore-db"

# Ingress Configs
ingress:
  zuul: true
  context: "filestore"

# Container Configs
image:
  repository: "egov-filestore"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/filestore/health"
  readinessProbePath: "/filestore/health"
appType: "java-spring"
tracing-enabled: true
is-bucket-fixed: "true"
fixed-bucketname: "egov-rainmaker"
heap: "-Xmx192m -Xms192m"
file-storage-mount-path: "/filestore"
is-nfs-enabled: false
is-s3-enabled: true
is-aws-bucket: true
spring-servlet-multipart-max-request-size: "30MB"

persistence:
  enabled: false

# Additional Container Envs
env: |
  - name: DB_HOST
    value: 10.232.161.103
  - name: DB_PORT
    value: '32431'
  - name: DB_USER
    value: root
  - name: DB_PASSWORD
    value: root
  - name: DB_NAME
    value: property-enumeration
  - name: DB_SSL_MODE
    value: disable
  - name: MINIO_ENDPOINT
    value: 10.232.161.103:30036
  - name: MINIO_ACCESS_KEY
    value: minioroot
  - name: MINIO_SECRET_KEY
    value: minioroot
  - name: MINIO_BUCKET
    value: digit
  - name: MINIO_READ_BUCKET
    value: digit
  - name: MINIO_USE_SSL
    value: ''